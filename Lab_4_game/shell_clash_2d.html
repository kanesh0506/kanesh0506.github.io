<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shell Clash 2D</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #0f141d;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            background: #1e2538;
            display: block;
        }
        /* UI Overlay */
        .hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .stat-box {
            background: rgba(15, 20, 29, 0.75);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .leaderboard {
            background: rgba(15, 20, 29, 0.85);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            border-radius: 12px;
            min-width: 220px;
        }
        .leaderboard h3 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #ffaa00;
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 4px;
        }
        .lb-entry {
            display: flex;
            justify-content: space-between;
            margin: 4px 0;
            font-size: 13px;
        }
        .lb-entry.player {
            color: #4df;
            font-weight: bold;
        }
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .weapon-card {
            background: rgba(15, 20, 29, 0.85);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 200, 0, 0.3);
            padding: 15px 25px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .ammo-count {
            font-size: 32px;
            font-weight: 900;
            color: #ffcc00;
            font-family: monospace;
        }
        .health-bar-container {
            width: 250px;
            height: 20px;
            background: rgba(0,0,0,0.5);
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.2);
            margin-top: 6px;
        }
        .health-bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff4d4d, #ff8000, #4dff88);
            transition: width 0.15s ease;
        }
        /* Touch Controls */
        .touch-container {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: none;
            justify-content: space-between;
            padding: 0 40px;
            pointer-events: auto;
        }
        .joystick-zone {
            width: 120px;
            height: 120px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 60px;
            position: relative;
            touch-action: none;
        }
        .joystick-knob {
            width: 50px;
            height: 50px;
            background: rgba(255, 200, 0, 0.6);
            border-radius: 25px;
            position: absolute;
            top: 35px;
            left: 35px;
        }
        .touch-btn {
            width: 70px;
            height: 70px;
            border-radius: 35px;
            background: rgba(255, 77, 77, 0.6);
            border: 2px solid rgba(255,255,255,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            touch-action: manipulation;
        }
        /* Modal screens */
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 14, 23, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            pointer-events: auto;
        }
        .modal h1 {
            font-size: 54px;
            color: #ffcc00;
            text-shadow: 0 0 20px rgba(255, 204, 0, 0.5);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .loadout-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin: 30px 0;
            max-width: 900px;
        }
        .weapon-option {
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .weapon-option:hover, .weapon-option.selected {
            border-color: #ffcc00;
            background: rgba(255, 204, 0, 0.15);
            transform: translateY(-4px);
        }
        .btn-play {
            background: linear-gradient(135deg, #ff9900, #ff5500);
            border: none;
            padding: 16px 45px;
            font-size: 22px;
            font-weight: bold;
            color: #fff;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 85, 0, 0.4);
            transition: all 0.2s;
        }
        .btn-play:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 85, 0, 0.6);
        }
        @media (max-width: 768px) {
            .touch-container { display: flex; }
            .loadout-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- UI Overlay -->
    <div class="hud-overlay">
        <div class="top-bar">
            <div class="stat-box">
                <div>KILLS: <span id="kill-count" style="color: #ff9900;">0</span></div>
                <div class="health-bar-container">
                    <div id="hp-bar" class="health-bar-fill"></div>
                </div>
            </div>
            <div class="leaderboard">
                <h3>Egg Scoreboard</h3>
                <div id="lb-list"></div>
            </div>
        </div>

        <div class="bottom-bar">
            <div class="weapon-card">
                <div>
                    <div id="weapon-name" style="font-size: 14px; color: #aaa; text-transform: uppercase;">EggK-47</div>
                    <div class="ammo-count"><span id="ammo-cur">30</span>/<span id="ammo-max">30</span></div>
                </div>
            </div>
        </div>

        <!-- Touch UI -->
        <div class="touch-container">
            <div class="joystick-zone" id="joy-move">
                <div class="joystick-knob" id="knob-move"></div>
            </div>
            <div style="display: flex; gap: 15px; align-items: flex-end;">
                <div class="touch-btn" id="btn-reload">R</div>
                <div class="touch-btn" id="btn-fire" style="background: rgba(255, 170, 0, 0.7); width: 85px; height: 85px; border-radius: 42px;">🔥</div>
            </div>
        </div>
    </div>

    <!-- Start / Respawn Modal -->
    <div class="modal" id="start-modal">
        <h1>🥚 Shell Clash 2D 🥚</h1>
        <p style="color: #bbb; font-size: 18px;">Select your Egg Loadout to enter the arena</p>
        
        <div class="loadout-grid">
            <div class="weapon-option selected" onclick="selectWeapon('eggk47', this)">
                <h3>EggK-47</h3>
                <p style="font-size: 12px; color: #aaa; margin-top: 6px;">Balanced Assault Rifle</p>
            </div>
            <div class="weapon-option" onclick="selectWeapon('shotgun', this)">
                <h3>Free Range</h3>
                <p style="font-size: 12px; color: #aaa; margin-top: 6px;">Heavy Duty Shotgun</p>
            </div>
            <div class="weapon-option" onclick="selectWeapon('sniper', this)">
                <h3>Crack-Shot</h3>
                <p style="font-size: 12px; color: #aaa; margin-top: 6px;">Long-Range Sniper</p>
            </div>
            <div class="weapon-option" onclick="selectWeapon('smg', this)">
                <h3>Scramble SMG</h3>
                <p style="font-size: 12px; color: #aaa; margin-top: 6px;">Rapid Fire Scrambler</p>
            </div>
        </div>

        <button class="btn-play" onclick="startGame()">CLUCK & LOAD!</button>
    </div>
</div>

<script>
// --- Web Audio Synthesizer ---
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() {
    if (!audioCtx) audioCtx = new AudioContext();
}

function playSound(type) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'shoot') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
    } else if (type === 'crack') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.2);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
    } else if (type === 'pickup') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.15);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
    } else if (type === 'reload') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.linearRampToValueAtTime(500, now + 0.2);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
    }
}

// --- Weapon Specifications ---
const WEAPONS = {
    eggk47: { name: 'EggK-47', damage: 24, rate: 120, speed: 14, ammo: 30, reload: 1500, spread: 0.08, count: 1 },
    shotgun: { name: 'Free Range', damage: 14, rate: 700, speed: 12, ammo: 8, reload: 2200, spread: 0.25, count: 6 },
    sniper: { name: 'Crack-Shot', damage: 85, rate: 1000, speed: 22, ammo: 5, reload: 2500, spread: 0.01, count: 1 },
    smg: { name: 'Scramble SMG', damage: 15, rate: 75, speed: 13, ammo: 40, reload: 1300, spread: 0.14, count: 1 }
};

// --- Game Engine Setup ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let mapWidth = 2000;
let mapHeight = 2000;
let selectedWeaponKey = 'eggk47';

let player = null;
let bots = [];
let bullets = [];
let particles = [];
let pickups = [];
let obstacles = [];
let gameLoopId = null;

let keys = {};
let mouse = { x: 0, y: 0, worldX: 0, worldY: 0, down: false };
let camera = { x: 0, y: 0 };

const BOT_NAMES = ['Scrambled', 'SunnySide', 'HardBoiled', 'OmeletMaster', 'YolkDestroyer', 'Egghead', 'PoachedPro'];

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Map & Obstacles Init
function initMap() {
    obstacles = [
        { x: 300, y: 300, w: 200, h: 200 },
        { x: 800, y: 400, w: 400, h: 100 },
        { x: 1400, y: 300, w: 200, h: 300 },
        { x: 400, y: 900, w: 100, h: 400 },
        { x: 900, y: 900, w: 200, h: 200 },
        { x: 1400, y: 1000, w: 300, h: 100 },
        { x: 300, y: 1500, w: 400, h: 150 },
        { x: 1100, y: 1400, w: 200, h: 300 }
    ];
}

// --- Player & Bot Entities ---
class EggCharacter {
    constructor(x, y, name, isBot = false, weaponKey = 'eggk47') {
        this.x = x;
        this.y = y;
        this.radius = 24;
        this.name = name;
        this.isBot = isBot;
        this.hp = 100;
        this.maxHp = 100;
        this.kills = 0;
        this.angle = 0;
        this.speed = 4;
        
        this.setWeapon(weaponKey);
        this.lastShot = 0;
        this.isReloading = false;
        
        // AI parameters
        this.targetX = x;
        this.targetY = y;
        this.changeTargetTimer = 0;
    }

    setWeapon(key) {
        this.weaponKey = key;
        this.weapon = { ...WEAPONS[key] };
        this.currentAmmo = this.weapon.ammo;
    }

    shoot() {
        const now = Date.now();
        if (this.isReloading || now - this.lastShot < this.weapon.rate) return;

        if (this.currentAmmo <= 0) {
            this.reload();
            return;
        }

        this.currentAmmo--;
        this.lastShot = now;
        playSound('shoot');

        for (let i = 0; i < this.weapon.count; i++) {
            const spreadAngle = (Math.random() - 0.5) * this.weapon.spread;
            const finalAngle = this.angle + spreadAngle;

            bullets.push({
                x: this.x + Math.cos(this.angle) * 30,
                y: this.y + Math.sin(this.angle) * 30,
                vx: Math.cos(finalAngle) * this.weapon.speed,
                vy: Math.sin(finalAngle) * this.weapon.speed,
                damage: this.weapon.damage,
                owner: this,
                range: 800
            });
        }

        if (this.currentAmmo <= 0) {
            this.reload();
        }
    }

    reload() {
        if (this.isReloading) return;
        this.isReloading = true;
        playSound('reload');
        setTimeout(() => {
            this.currentAmmo = this.weapon.ammo;
            this.isReloading = false;
        }, this.weapon.reload);
    }

    update() {
        if (this.hp <= 0) return;

        if (this.isBot) {
            this.updateAI();
        }

        // Keep inside boundaries
        this.x = Math.max(this.radius, Math.min(mapWidth - this.radius, this.x));
        this.y = Math.max(this.radius, Math.min(mapHeight - this.radius, this.y));

        // Obstacle collisions
        obstacles.forEach(obs => {
            if (this.x + this.radius > obs.x && this.x - this.radius < obs.x + obs.w &&
                this.y + this.radius > obs.y && this.y - this.radius < obs.y + obs.h) {
                
                let overlapX = (this.radius + obs.w/2) - Math.abs(this.x - (obs.x + obs.w/2));
                let overlapY = (this.radius + obs.h/2) - Math.abs(this.y - (obs.y + obs.h/2));

                if (overlapX < overlapY) {
                    this.x += (this.x > obs.x + obs.w/2) ? overlapX : -overlapX;
                } else {
                    this.y += (this.y > obs.y + obs.h/2) ? overlapY : -overlapY;
                }
            }
        });
    }

    updateAI() {
        let targets = [player, ...bots].filter(e => e && e !== this && e.hp > 0);
        let closest = null;
        let minDist = 9999;

        targets.forEach(t => {
            let dist = Math.hypot(t.x - this.x, t.y - this.y);
            if (dist < minDist) {
                minDist = dist;
                closest = t;
            }
        });

        if (closest && minDist < 600) {
            this.angle = Math.atan2(closest.y - this.y, closest.x - this.x);
            if (minDist > 150) {
                this.x += Math.cos(this.angle) * (this.speed * 0.7);
                this.y += Math.sin(this.angle) * (this.speed * 0.7);
            }
            if (Math.random() < 0.05) this.shoot();
        } else {
            if (Date.now() > this.changeTargetTimer) {
                this.targetX = Math.random() * mapWidth;
                this.targetY = Math.random() * mapHeight;
                this.changeTargetTimer = Date.now() + 3000 + Math.random() * 2000;
            }
            this.angle = Math.atan2(this.targetY - this.y, this.targetX - this.x);
            this.x += Math.cos(this.angle) * (this.speed * 0.5);
            this.y += Math.sin(this.angle) * (this.speed * 0.5);
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x - camera.x, this.y - camera.y);

        // Render Egg Shadow
        ctx.beginPath();
        ctx.ellipse(0, 15, this.radius, this.radius * 0.5, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.fill();

        // Render Egg Base Shape
        ctx.rotate(this.angle);
        ctx.beginPath();
        ctx.ellipse(0, 0, this.radius * 1.1, this.radius * 0.9, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#fffdf0';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#d4ceb8';
        ctx.stroke();

        // Egg Crack visuals if low HP
        if (this.hp < 60) {
            ctx.beginPath();
            ctx.moveTo(-5, -10); ctx.lineTo(0, -2); ctx.lineTo(-8, 5);
            ctx.strokeStyle = '#998877';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // Egg Eyes
        ctx.fillStyle = '#222';
        ctx.beginPath();
        ctx.arc(8, -6, 3, 0, Math.PI * 2);
        ctx.arc(8, 6, 3, 0, Math.PI * 2);
        ctx.fill();

        // Weapon Rendering
        ctx.fillStyle = '#333';
        ctx.fillRect(10, 2, 20, 6);

        ctx.restore();

        // Name tag & HP Bar
        ctx.save();
        ctx.translate(this.x - camera.x, this.y - camera.y - 35);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(this.name, 0, 0);

        // Mini HP Bar
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(-20, 5, 40, 5);
        ctx.fillStyle = this.hp > 30 ? '#4dff88' : '#ff4d4d';
        ctx.fillRect(-20, 5, (this.hp / this.maxHp) * 40, 5);
        ctx.restore();
    }
}

// Selection logic for menu
function selectWeapon(key, el) {
    selectedWeaponKey = key;
    document.querySelectorAll('.weapon-option').forEach(item => item.classList.remove('selected'));
    el.classList.add('selected');
}

function startGame() {
    if (gameLoopId) {
        cancelAnimationFrame(gameLoopId);
        gameLoopId = null;
    }

    initAudio();
    initMap();

    bullets = [];
    particles = [];
    
    player = new EggCharacter(mapWidth / 2, mapHeight / 2, 'You (Shell-Shock)', false, selectedWeaponKey);
    bots = [];
    
    const weaponKeys = Object.keys(WEAPONS);
    for (let i = 0; i < 6; i++) {
        let rx = Math.random() * mapWidth;
        let ry = Math.random() * mapHeight;
        let randomWeapon = weaponKeys[Math.floor(Math.random() * weaponKeys.length)];
        bots.push(new EggCharacter(rx, ry, BOT_NAMES[i % BOT_NAMES.length], true, randomWeapon));
    }

    spawnPickups();

    document.getElementById('start-modal').style.display = 'none';
    gameLoopId = requestAnimationFrame(gameLoop);
}

function spawnPickups() {
    pickups = [];
    for (let i = 0; i < 10; i++) {
        pickups.push({
            x: Math.random() * mapWidth,
            y: Math.random() * mapHeight,
            type: Math.random() > 0.5 ? 'ammo' : 'health',
            radius: 12
        });
    }
}

// --- Particles Engine ---
function createSplatter(x, y, isYolk = false) {
    playSound('crack');
    for (let i = 0; i < 15; i++) {
        particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8,
            radius: Math.random() * 5 + 2,
            color: isYolk ? '#ffcc00' : '#fffdf0',
            life: 1.0
        });
    }
}

// --- Controls Input Listeners ---
window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (e.key.toLowerCase() === 'r' && player && player.hp > 0) player.reload();
});

window.addEventListener('keyup', e => {
    keys[e.key.toLowerCase()] = false;
});

window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

window.addEventListener('mousedown', () => { mouse.down = true; });
window.addEventListener('mouseup', () => { mouse.down = false; });

// Joystick Touch Implementation
const joyZone = document.getElementById('joy-move');
const knob = document.getElementById('knob-move');
let joyActive = false;
let joyVector = { x: 0, y: 0 };

joyZone.addEventListener('touchstart', e => { joyActive = true; updateJoystick(e.touches[0]); });
joyZone.addEventListener('touchmove', e => { if(joyActive) updateJoystick(e.touches[0]); });
joyZone.addEventListener('touchend', () => {
    joyActive = false;
    knob.style.left = '35px';
    knob.style.top = '35px';
    joyVector = { x: 0, y: 0 };
});

function updateJoystick(touch) {
    const rect = joyZone.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    let dx = touch.clientX - centerX;
    let dy = touch.clientY - centerY;
    let dist = Math.hypot(dx, dy);
    let maxDist = 40;

    if (dist > maxDist) {
        dx = (dx / dist) * maxDist;
        dy = (dy / dist) * maxDist;
    }

    knob.style.left = (35 + dx) + 'px';
    knob.style.top = (35 + dy) + 'px';
    joyVector = { x: dx / maxDist, y: dy / maxDist };
}

document.getElementById('btn-fire').addEventListener('touchstart', (e) => { e.preventDefault(); mouse.down = true; });
document.getElementById('btn-fire').addEventListener('touchend', (e) => { e.preventDefault(); mouse.down = false; });
document.getElementById('btn-reload').addEventListener('touchstart', (e) => { e.preventDefault(); if (player && player.hp > 0) player.reload(); });

// --- Main Game Loop ---
function gameLoop() {
    if (!player) return;

    // --- Player Movement & Control Update ---
    if (player.hp > 0) {
        let dx = 0;
        let dy = 0;

        if (keys['w'] || keys['arrowup']) dy -= 1;
        if (keys['s'] || keys['arrowdown']) dy += 1;
        if (keys['a'] || keys['arrowleft']) dx -= 1;
        if (keys['d'] || keys['arrowright']) dx += 1;

        if (joyActive) {
            dx = joyVector.x;
            dy = joyVector.y;
        }

        if (dx !== 0 || dy !== 0) {
            let len = Math.hypot(dx, dy);
            player.x += (dx / len) * player.speed;
            player.y += (dy / len) * player.speed;
        }

        // Camera smoothly tracks player position
        camera.x = player.x - canvas.width / 2;
        camera.y = player.y - canvas.height / 2;

        // Aim angle calculation
        mouse.worldX = mouse.x + camera.x;
        mouse.worldY = mouse.y + camera.y;
        player.angle = Math.atan2(mouse.worldY - player.y, mouse.worldX - player.x);

        if (mouse.down) player.shoot();
        player.update();
    }

    // --- Update Bots ---
    bots.forEach(bot => bot.update());

    // --- Update Bullets ---
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.range -= Math.hypot(b.vx, b.vy);

        let hitWall = obstacles.some(obs => b.x > obs.x && b.x < obs.x + obs.w && b.y > obs.y && b.y < obs.y + obs.h);

        if (b.range <= 0 || hitWall || b.x < 0 || b.x > mapWidth || b.y < 0 || b.y > mapHeight) {
            bullets.splice(i, 1);
            continue;
        }

        let targets = [player, ...bots];
        for (let t of targets) {
            if (t !== b.owner && t.hp > 0 && Math.hypot(t.x - b.x, t.y - b.y) < t.radius) {
                t.hp -= b.damage;
                createSplatter(t.x, t.y, true);

                if (t.hp <= 0) {
                    createSplatter(t.x, t.y, false);
                    b.owner.kills++;
                    
                    if (t.isBot) {
                        setTimeout(() => {
                            t.x = Math.random() * mapWidth;
                            t.y = Math.random() * mapHeight;
                            t.hp = t.maxHp;
                        }, 3000);
                    } else {
                        // Game Over: Display modal and cancel existing animation loop
                        document.getElementById('start-modal').style.display = 'flex';
                        if (gameLoopId) {
                            cancelAnimationFrame(gameLoopId);
                            gameLoopId = null;
                        }
                        return;
                    }
                }

                bullets.splice(i, 1);
                break;
            }
        }
    }

    // --- Update Pickups ---
    if (player.hp > 0) {
        for (let i = pickups.length - 1; i >= 0; i--) {
            let p = pickups[i];
            if (Math.hypot(player.x - p.x, player.y - p.y) < player.radius + p.radius) {
                playSound('pickup');
                if (p.type === 'health') {
                    player.hp = Math.min(player.maxHp, player.hp + 40);
                } else {
                    player.currentAmmo = player.weapon.ammo;
                }
                pickups.splice(i, 1);
            }
        }
    }

    // --- Update Particles ---
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.02;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // --- Render Pipeline ---
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Grid Floor
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    let gridSize = 80;
    let startX = -camera.x % gridSize;
    let startY = -camera.y % gridSize;

    for (let x = startX; x < canvas.width; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = startY; y < canvas.height; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }
    ctx.restore();

    // Render Map Obstacles
    ctx.fillStyle = '#2a344d';
    ctx.strokeStyle = '#3d4b6e';
    ctx.lineWidth = 4;
    obstacles.forEach(obs => {
        ctx.fillRect(obs.x - camera.x, obs.y - camera.y, obs.w, obs.h);
        ctx.strokeRect(obs.x - camera.x, obs.y - camera.y, obs.w, obs.h);
    });

    // Render Pickups
    pickups.forEach(p => {
        ctx.save();
        ctx.translate(p.x - camera.x, p.y - camera.y);
        ctx.beginPath();
        ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.type === 'health' ? '#ff4d4d' : '#ffcc00';
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(p.type === 'health' ? '+' : '⚡', 0, 4);
        ctx.restore();
    });

    // Render Particles
    particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x - camera.x, p.y - camera.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });

    // Render Bullets
    ctx.fillStyle = '#ffcc00';
    bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x - camera.x, b.y - camera.y, 4, 0, Math.PI * 2);
        ctx.fill();
    });

    // Render Entities
    if (player.hp > 0) player.draw();
    bots.forEach(bot => {
        if (bot.hp > 0) bot.draw();
    });

    // --- Update HUD ---
    document.getElementById('kill-count').innerText = player.kills;
    document.getElementById('hp-bar').style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
    document.getElementById('weapon-name').innerText = player.weapon.name;
    document.getElementById('ammo-cur').innerText = player.isReloading ? 'RELOADING...' : player.currentAmmo;
    document.getElementById('ammo-max').innerText = player.weapon.ammo;

    // Leaderboard update
    let allPlayers = [player, ...bots].sort((a, b) => b.kills - a.kills);
    let lbHTML = '';
    allPlayers.slice(0, 5).forEach(item => {
        lbHTML += `<div class="lb-entry ${item === player ? 'player' : ''}">
            <span>${item.name}</span>
            <span>${item.kills}</span>
        </div>`;
    });
    document.getElementById('lb-list').innerHTML = lbHTML;

    gameLoopId = requestAnimationFrame(gameLoop);
}
</script>
</body>
</html>
